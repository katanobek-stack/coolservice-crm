<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ППЗ — демонстрация нового интерфейса</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--border:#e2e8f0;--border2:#cbd5e1;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--accent:#3b82f6;--accent2:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Manrope,Arial,sans-serif;font-size:15px}button,input,textarea,select{font:inherit}.ppz { display: grid; gap: 16px; color: var(--text); }
.ppz-ranking-cards { display: none; }
.ppz-ranking-card { border: 1px solid var(--border); border-left: 4px solid var(--ppz-person, #3b82f6); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ppz-ranking-card dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.ppz-ranking-card dl > div { padding: 10px; border-radius: 10px; background: var(--ppz-tint, #f0f6ff); }
.ppz-ranking-card dt { font-size: 12px; color: var(--text2); }
.ppz-ranking-card dd { margin: 4px 0 0; font-size: 24px; font-weight: 800; color: var(--text); }
@media (max-width: 767px) { .ppz-ranking-cards { display: grid; gap: 12px; } .ppz-ranking-desktop { display: none; } }
.ppz-table-scroll { overflow-x: auto; min-width: 0; max-width: 100%; }
.ppz-accounting { width: 100%; min-width: 850px; border-collapse: collapse; font-size: 13px; }
.ppz-accounting th, .ppz-accounting td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); overflow-wrap: normal; word-break: normal; }
.ppz-accounting th:first-child, .ppz-accounting td:first-child { min-width: 130px; }
.ppz-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ppz-controls > input, .ppz-controls > select { width: auto; min-width: 170px; }
.ppz-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: grid; gap: 12px; overflow-wrap: anywhere; }
.ppz p, .ppz h3 { margin: 0; }
.ppz-muted { color: var(--text2); font-size: 13px; }
.ppz-warning { background: #fff7e0; color: #795200; padding: 14px; border-radius: 10px; }
.ppz-error { color: #b91c1c; background: #fef2f2; padding: 12px; border-radius: 10px; }
.ppz-editor { border: 0; margin: 0; padding: 0; display: grid; gap: 14px; min-width: 0; }
.ppz-editor > .ppz-row { flex-wrap: nowrap; }
.ppz-editor .ppz-row > input, .ppz-editor .ppz-row > select { flex: 1; min-width: 0; }
.ppz-work { display: grid; gap: 10px; }
.ppz-comment { white-space: pre-wrap; background: #f5f7fa; padding: 12px; border-radius: 8px; }
.ppz button:disabled { cursor: default; opacity: .5; }
.ppz-person--blue { --ppz-person: #2563a4; --ppz-tint: #eef6ff; }
.ppz-person--violet { --ppz-person: #7c3caa; --ppz-tint: #f8f0ff; }
.ppz-person--teal { --ppz-person: #087f75; --ppz-tint: #edfaf7; }
.ppz-person--amber { --ppz-person: #986000; --ppz-tint: #fff8e8; }
.ppz-person--rose { --ppz-person: #b13f66; --ppz-tint: #fff0f5; }
.ppz-person--indigo { --ppz-person: #4d55af; --ppz-tint: #f1f2ff; }
.ppz-people { display: flex; flex-wrap: wrap; gap: 8px; }
.ppz-person { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 20px; background: var(--ppz-tint, #eef6ff); color: var(--ppz-person, #2563a4); font-size: 12px; font-weight: 600; }
.ppz-person-dot { display: inline-block; vertical-align: middle; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--ppz-person, #2563a4); }
.ppz-task { border-left: 4px solid #b6c8dd; box-shadow: 0 4px 16px rgba(31, 63, 96, .04); }
.ppz-task--open { border-left-color: #cf9a35; background: linear-gradient(115deg, #fffcf3, #fff 60%); }
.ppz-task--in_progress { border-left-color: #428be0; background: linear-gradient(115deg, #f0f7ff, #fff 60%); }
.ppz-task--done { border-left-color: #32a07c; background: linear-gradient(115deg, #effbf5, #fff 60%); }
.ppz-status { padding: 5px 10px; border-radius: 20px; background: #fff3d5; color: #865b08; font-size: 12px; font-weight: 600; }
.ppz-status--in_progress { color: #245d9f; background: #e5f0ff; }
.ppz-status--done { color: #16724f; background: #def5e9; }
.ppz-participant { padding: 14px; border-radius: 12px; background: var(--ppz-tint, #f7f9fc); border: 1px solid #e0e9f1; border-left: 3px solid var(--ppz-person, #9cb7d2); display: grid; gap: 8px; }
.ppz-participant.is-working { box-shadow: inset 0 0 0 1px #bdd8f5; }
.ppz-participant.is-reported .ppz-muted { color: #246b54; }
.ppz-day-banner { padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-radius: 14px; color: var(--ppz-person, #2563a4); background: var(--ppz-tint, #eef6ff); border: 1px solid #e0e9f1; }
.ppz-day-banner > span { font-size: 12px; }
.ppz-photo-picker { min-width: 0; margin: 0; padding: 12px; border: 1px dashed #aac6df; border-radius: 10px; background: #f7fbff; }
.ppz-photo-picker legend { font-size: 12px; font-weight: 600; color: #386588; padding: 0 5px; }
.ppz-photo-select { position: relative; display: inline-flex; overflow: hidden; padding: 8px 12px; border-radius: 8px; border: 1px solid #c6d9ea; background: #fff; color: #315f87; cursor: pointer; font-size: 12px; }
.ppz-photo-select:focus-within { outline: 2px solid #4388f4; outline-offset: 2px; }
.ppz-photo-select input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.ppz-photo-picker:disabled { opacity: .6; }
.ppz-photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.ppz-photo-grid > div, .ppz-photo-grid > button { position: relative; width: 86px; height: 74px; padding: 0; border: 1px solid #d1dfeb; border-radius: 9px; background: #edf3f8; }
.ppz-photo-grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.ppz-photo-grid > button { cursor: zoom-in; }
.ppz-photo-grid > div > button { position: absolute; right: -5px; top: -5px; width: 24px; height: 24px; padding: 0; border-radius: 50%; color: #fff; background: #536b80; border: 2px solid #fff; cursor: pointer; }
.ppz-accounting th { color: #41627f; background: #edf5fd; }
.ppz-accounting tbody tr:nth-child(even) { background: #f7faff; }
@media (max-width: 600px) { .ppz-editor > .ppz-row { flex-wrap: wrap; } .ppz-editor > .ppz-row > input, .ppz-editor > .ppz-row > select { flex-basis: 100%; } .ppz-card { padding: 14px; } .ppz-controls > input, .ppz-controls > select { width: 100%; } }
