*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#F4F7FB;color:#111827;font-family:'DM Sans',sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#98A2B3;border-radius:4px}
input,select,textarea,button{font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.38);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.md{background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 100%);border-radius:24px 24px 0 0;padding:20px 18px 32px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border:1px solid rgba(56,189,248,.15);border-bottom:none;box-shadow:0 -20px 60px rgba(15,23,42,.16)}
.fi{width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(15,23,42,.1);background:rgba(15,23,42,.04);color:#111827;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.fi:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}.fi::placeholder{color:#3d556e}
textarea.fi{min-height:75px;resize:vertical}
.bp{width:100%;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#0284c7 0%,#38bdf8 100%);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(14,165,233,.35);transition:transform .15s,box-shadow .15s;letter-spacing:.01em}
.bp:active{transform:scale(.97);box-shadow:0 2px 10px rgba(14,165,233,.2)}
.card{background:linear-gradient(135deg,rgba(13,28,60,.9) 0%,rgba(16,38,82,.7) 100%);border-radius:16px;padding:14px 16px 14px 20px;margin-bottom:10px;border:1px solid rgba(56,189,248,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#38bdf8,#0284c7);border-radius:3px 0 0 3px;opacity:.8}
.card:active{transform:scale(.985);box-shadow:0 0 0 2px rgba(56,189,248,.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{animation:cardIn .18s ease both}
.rc{background:rgba(15,23,42,.03);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(15,23,42,.06)}
.ti{background:rgba(15,23,42,.02);border:1px solid rgba(15,23,42,.05);border-radius:11px;padding:10px 12px;margin-top:8px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pt{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;border:1px solid rgba(15,23,42,.08);cursor:pointer;transition:transform .15s}
.pt:active{transform:scale(.95)}
.nb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 8px 8px;background:linear-gradient(180deg,#FFFFFF,#F4F7FB);border-bottom:1px solid rgba(56,189,248,.07);flex-shrink:0}
.nb button{padding:11px 4px;border:none;background:transparent;color:#98A2B3;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;white-space:nowrap;border:1px solid transparent;transition:all .15s}
.nb button:active{transform:scale(.95)}
.nb button.a{color:#38bdf8;font-weight:700;background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.2);box-shadow:0 2px 10px rgba(56,189,248,.1)}
.tb{padding:10px 8px;border-radius:12px;border:1px solid rgba(15,23,42,.08);background:rgba(15,23,42,.03);color:#667085;font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.tb.a{border-color:#38bdf8;background:rgba(56,189,248,.12);color:#38bdf8;font-weight:700;box-shadow:0 0 12px rgba(56,189,248,.15)}
.iv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.iv img{max-width:95%;max-height:90%;object-fit:contain;border-radius:10px}
.ct{flex:1;overflow-y:auto;padding:12px 16px 90px}
.ct::-webkit-scrollbar{display:none}.ct{-ms-overflow-style:none;scrollbar-width:none}
/* Stats classes */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:linear-gradient(135deg,rgba(13,28,60,.95),rgba(16,38,82,.7));border-radius:16px;padding:16px;border:1px solid rgba(56,189,248,.1);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.07),transparent 70%)}
.stat-num{font-size:26px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.stat-lbl{font-size:10px;color:#98A2B3;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.stat-card.green::after{background:radial-gradient(circle,rgba(52,211,153,.07),transparent 70%)}
.stat-card.green .stat-num{background:linear-gradient(90deg,#34d399,#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card.purple::after{background:radial-gradient(circle,rgba(167,139,250,.07),transparent 70%)}
.stat-card.purple .stat-num{background:linear-gradient(90deg,#a78bfa,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card.orange::after{background:radial-gradient(circle,rgba(251,146,60,.07),transparent 70%)}
.stat-card.orange .stat-num{background:linear-gradient(90deg,#fb923c,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chart-wrap{background:linear-gradient(135deg,rgba(13,28,60,.9),rgba(16,38,82,.6));border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(56,189,248,.1)}
.chart-title{font-size:11px;font-weight:700;color:#8A96A8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
@keyframes notif-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes swipeDone{0%{background:transparent}50%{background:rgba(34,197,94,.15)}100%{background:transparent}}
.swipe-flash{animation:swipeDone .5s ease}

:root{
  --cs-bg:#F4F7FB;--cs-surface:#FFFFFF;--cs-surface-2:#F7F9FC;--cs-surface-3:#EEF3F8;
  --cs-text:#172033;--cs-muted:#667085;--cs-soft:#98A2B3;--cs-border:#E2E8F0;
  --cs-blue:#185FA5;--cs-blue-bg:#E6F1FB;--cs-green:#3B6D11;--cs-green-bg:#EAF3DE;
  --cs-amber:#BA7517;--cs-amber-bg:#FAEEDA;--cs-red:#A32D2D;--cs-red-bg:#FBEAEA;
  --cs-radius:18px;--cs-shadow:0 10px 32px rgba(15,23,42,.08);--cs-shadow-soft:0 3px 14px rgba(15,23,42,.06);

html,body{background:var(--cs-bg)!important;color:var(--cs-text)!important;font-size:16px!important;line-height:1.35;}

.bp{min-height:48px;border-radius:15px!important;background:#185FA5!important;background:linear-gradient(135deg,#185FA5,#2D7CC4)!important;font-size:16px!important;box-shadow:0 8px 22px rgba(24,95,165,.22)!important;}
.card,.rc,.ti,.stat-card,.chart-wrap{background:var(--cs-surface)!important;border:1px solid var(--cs-border)!important;color:var(--cs-text)!important;box-shadow:var(--cs-shadow-soft)!important;}
.card{border-radius:0 var(--cs-radius) var(--cs-radius) 0!important;padding:14px 15px!important;margin-bottom:11px!important;border-left:4px solid var(--cs-blue)!important;}
.card::before{display:none!important}.card:active,.rc:active{transform:scale(.99)}
.rc{border-radius:var(--cs-radius)!important;padding:14px!important;margin-bottom:11px!important;}
.ti{border-radius:14px!important;padding:12px!important;background:var(--cs-surface-2)!important;box-shadow:none!important;}
.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin-bottom:14px!important;}
.stat-card{border-radius:18px!important;padding:14px!important;min-height:92px!important;}
.stat-card::after{background:radial-gradient(circle,rgba(24,95,165,.07),transparent 72%)!important;}
.stat-num{font-size:25px!important;font-weight:700!important;color:var(--cs-text)!important;background:none!important;-webkit-text-fill-color:currentColor!important;}

.nb{position:absolute!important;left:0;right:0;bottom:0;z-index:80;display:flex!important;grid-template-columns:none!important;gap:0!important;padding:8px 6px calc(10px + env(safe-area-inset-bottom))!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(16px);border-top:1px solid var(--cs-border)!important;border-bottom:none!important;box-shadow:0 -10px 30px rgba(15,23,42,.07);overflow-x:auto;}
.nb::-webkit-scrollbar{display:none}.nb button{flex:1;min-width:66px;height:56px;padding:6px 4px!important;border-radius:16px!important;color:var(--cs-soft)!important;font-size:11px!important;line-height:1.1;flex-direction:column!important;gap:3px!important;background:transparent!important;border:1px solid transparent!important;}

.ov{align-items:flex-end!important;background:rgba(15,23,42,.38)!important;backdrop-filter:blur(8px)}
.md{background:var(--cs-surface)!important;color:var(--cs-text)!important;border:1px solid var(--cs-border)!important;border-radius:28px 28px 0 0!important;padding:20px 18px 34px!important;box-shadow:0 -20px 60px rgba(15,23,42,.20)!important;}
.pg{gap:9px!important}.pt{border-radius:14px!important;border:1px solid var(--cs-border)!important;}
::-webkit-scrollbar-thumb{background:#CBD5E1!important}.plate,span[style*='JetBrains Mono']{background:#F2F4F7!important;color:#344054!important;border:1px solid #E4E7EC!important;}

// Инициализация FCM выполняется один раз — после того, как пользователь:
//  1) залогинился, 2) дал разрешение на уведомления.
// Если service worker firebase-messaging-sw.js не положен в репозиторий —
// инициализация просто молча не выполнится, основной функционал CRM продолжит работать.
function initFCM(){
  if(fcmInitTried){fcmAdd("⏭ Уже пробовали","fcmInitTried=true");return}
  if(!S.u){fcmAdd("⛔ Нет пользователя","S.u пуст");return}
  if(!("Notification" in window)){fcmAdd("⛔ Нет API Notification","браузер не поддерживает");return}
  if(Notification.permission!=="granted"){fcmAdd("⛔ Нет разрешения","permission="+Notification.permission);return}
  fcmInitTried=true;
  fcmAdd("✅ Старт","UA="+navigator.userAgent.substring(0,80));

  isSupported().then(function(supported){
    if(!supported){fcmAdd("⛔ FCM не поддерживается","isSupported()=false");return}
    fcmAdd("✅ FCM поддерживается");
    // Регистрируем sw-файл (должен лежать рядом с index.html)
    return navigator.serviceWorker.register("./firebase-messaging-sw.js",{scope:"./"}).then(function(reg){
      fcmAdd("✅ SW зарегистрирован","scope="+reg.scope);
      try{messaging=getMessaging(fbApp);fcmAdd("✅ getMessaging OK")}catch(e){fcmAdd("⛔ getMessaging failed",String(e));return}
      // Получаем токен этого устройства
      return getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg}).then(function(token){
        if(!token){fcmAdd("⛔ Токен пустой","getToken вернул null/empty");return}
        fcmAdd("✅ Токен получен",token.substring(0,30)+"... ("+token.length+" симв.)");
        // Сохраняем токен в Firestore staff/{uid}, чтобы сервер мог слать пуши
        if(S.u){
          var existing=S.st.find(function(s){return s.id===S.u.uid});
          var tokens=(existing&&existing.fcmTokens)||[];
          if(tokens.indexOf(token)<0){
            tokens.push(token);
            // Храним массив токенов — у одного человека может быть несколько устройств
            fbStaff(S.u.uid,{fcmTokens:tokens,fcmUpdatedAt:new Date().toISOString()}).then(function(){
              fcmAdd("✅ Токен сохранён в Firestore","всего токенов: "+tokens.length);
            }).catch(function(err){
              fcmAdd("⛔ Ошибка записи в Firestore",String(err));
            });
          }else{
            fcmAdd("ℹ️ Токен уже есть в базе","всего токенов: "+tokens.length);
          }
        }
        // Слушаем пуши, когда приложение открыто (foreground)
        onMessage(messaging,function(payload){
          var t=(payload.notification&&payload.notification.title)||"РефСервисДВ";
          var b=(payload.notification&&payload.notification.body)||"";
          if(typeof showBrowserNotif==="function")showBrowserNotif(t,b);
          else playNotifSound&&playNotifSound();
        });
      }).catch(function(err){
        fcmAdd("⛔ getToken ошибка",String(err)+(err.code?" code="+err.code:""));
      });
    }).catch(function(err){
      fcmAdd("⛔ SW не зарегистрировался",String(err));
    });
  }).catch(function(err){fcmAdd("⛔ FCM init err",String(err))});
}

// Показать диагностику в модалке (вызывается с кнопки в Сводке)
function showFCMDiagnostic(){
  var info=[];
  info.push("URL: "+location.href);
  info.push("Display mode: "+(window.matchMedia("(display-mode: standalone)").matches?"standalone (PWA)":"browser tab"));
  info.push("HTTPS: "+(location.protocol==="https:"?"да":"нет"));
  info.push("Service Worker API: "+("serviceWorker" in navigator?"есть":"нет"));
  info.push("Notification API: "+("Notification" in window?"есть":"нет"));
  if("Notification" in window)info.push("Notification.permission: "+Notification.permission);
  info.push("User-Agent: "+navigator.userAgent);
  info.push("Online: "+navigator.onLine);
  info.push("--- Логи initFCM ---");
  if(fcmLog.length===0)info.push("(пусто, initFCM не вызывался)");
  else fcmLog.forEach(function(e){info.push(e.ts+" "+e.stage+(e.info?" — "+e.info:""))});
  // Текущие токены пользователя
  var me=S.st.find(function(s){return s.id===(S.u&&S.u.uid)});
  if(me&&me.fcmTokens){
    info.push("--- Токены в Firestore ---");
    info.push("Всего: "+me.fcmTokens.length);
    me.fcmTokens.forEach(function(t,i){info.push("["+i+"] "+t.substring(0,40)+"...")});
  }else info.push("--- Токенов в Firestore нет ---");
  return info.join("\n");
}

// Принудительно перезапустить FCM (например после смены разрешения)
function forceFCMRetry(){
  fcmLog=[];
  fcmInitTried=false;
  // Снимем существующую регистрацию SW и попробуем заново
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){if(r.active&&r.active.scriptURL.indexOf("firebase-messaging")>=0)r.unregister()});
      setTimeout(initFCM,500);
    });
  }else initFCM();
}

function compressToBlob(file,mw,q){mw=mw||800;q=q||0.5;return new Promise(function(resolve){var fr=new FileReader;fr.onload=function(e){var img=new Image;img.onload=function(){var c=document.createElement("canvas");var w=img.width,ht=img.height;if(w>mw){ht=ht*(mw/w);w=mw}c.width=w;c.height=ht;c.getContext("2d").drawImage(img,0,0,w,ht);c.toBlob(function(blob){resolve(blob)},"image/jpeg",q)};img.src=e.target.result};fr.readAsDataURL(file)})}

function uploadPhoto(file){

function makeMicBtn(textarea){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var btn=h("button",{s:{padding:"8px 14px",borderRadius:"8px",border:"1px solid rgba(239,68,68,.25)",background:"rgba(239,68,68,.05)",color:"#f87171",fontSize:"12px",fontWeight:"600",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"4px",marginTop:"6px",transition:"all .2s"}});
  btn.innerHTML=IC.mic.replace("1em","12px")+" Голос";
  var recording=false;
  var recognition=null;
  btn.addEventListener("click",function(){
    if(recording){
      if(recognition)recognition.stop();
      return;
    }
    recognition=new SR();
    recognition.lang="ru-RU";
    recognition.continuous=false;
    recognition.interimResults=false;
    recording=true;
    btn.textContent="● Говорите...";
    btn.style.borderColor="rgba(239,68,68,.6)";
    btn.style.background="rgba(239,68,68,.15)";
    btn.style.animation="notif-pulse 1s infinite";
    recognition.onresult=function(e){
      var text="";
      for(var i=0;i<e.results.length;i++){
        text+=e.results[i][0].transcript;
      }
      if(text){
        var cur=textarea.value;
        textarea.value=cur+(cur?" ":"")+text;
      }
    };
    recognition.onerror=function(){stopRec()};
    recognition.onend=function(){stopRec()};
    recognition.start();
    function stopRec(){
      recording=false;
      btn.innerHTML=IC.mic.replace("1em","12px")+" Голос";
      btn.style.borderColor="rgba(239,68,68,.25)";
      btn.style.background="rgba(239,68,68,.05)";
      btn.style.animation="none";
      recognition=null;
    }
  });
  return btn;
}

function fgWithMic(label,textarea){
  var g=h("div",{s:{marginBottom:"14px"}});
  g.appendChild(h("label",{s:{display:"block",fontSize:"12px",fontWeight:"600",color:"#667085",marginBottom:"6px",textTransform:"uppercase",letterSpacing:".05em"}},label));
  g.appendChild(textarea);
  var mic=makeMicBtn(textarea);
  if(mic)g.appendChild(mic);
  return g;
}

function rSt(r){
  if(r.status==="cancelled")return"cancelled";
  if(r.closedByManager)return"done";
  var t=r.tasks||[];
  if(!t.length)return r.status||"in_progress";
  return t.every(function(x){return tSt(x)==="done"})?"done":"in_progress";
}

// Multi-assignee helpers
function getAssignees(t){if(t.assignees&&t.assignees.length)return t.assignees;if(t.assignee)return[t.assignee];return[]}
function getDoneBy(t){return t.doneBy||[]}
function tSt(t){
  // If status explicitly done — always done (legacy, force-close, freon close)
  if(t.status==="done")return"done";
  // Multi-assignee: check doneBy
  var a=getAssignees(t);
  var d=getDoneBy(t);
  if(a.length>0&&d.length>0&&a.every(function(uid){return d.indexOf(uid)>=0}))return"done";
  return"in_progress";
}
function isMyDone(t){var uid=S.u?S.u.uid:"";var d=getDoneBy(t);return d.indexOf(uid)>=0}
function isMyTask(t){var uid=S.u?S.u.uid:"";var a=getAssignees(t);return a.indexOf(uid)>=0}
function assigneeNames(t){return getAssignees(t).map(function(uid){return sN(uid)}).join(", ")}
function toggleMultiTask(t,cid,rid,tid){
  // Toggle current user's done status in multi-assignee task
  var uid=S.u.uid;
  var cl=S.cl.find(function(c){return c.id===cid});if(!cl)return;
  var rp=(cl.repairs||[]).slice();var ri=rp.findIndex(function(r){return r.id===rid});if(ri<0)return;
  var ts=(rp[ri].tasks||[]).slice();var ti=ts.findIndex(function(x){return x.id===tid});if(ti<0)return;
  var task=ts[ti];var doneBy=(task.doneBy||[]).slice();
  var idx=doneBy.indexOf(uid);
  if(idx>=0)doneBy.splice(idx,1);else doneBy.push(uid);
  var allDone=getAssignees(task).every(function(u){return doneBy.indexOf(u)>=0});
  ts[ti]=Object.assign({},task,{doneBy:doneBy,status:allDone?"done":"in_progress"});
  rp[ri]=Object.assign({},rp[ri],{tasks:ts});fbArr(cid,"repairs",rp);
}

function parseKg(v){
  if(v===undefined||v===null||v==="")return 0;
  var n=parseFloat(String(v).replace(",","."));
  return isNaN(n)?0:n;
}

  ((r&&r.tasks)||[]).forEach(function(t){
    var tk=parseKg(t.freonKg);
    if(tk>0&&(t.freonTask||((t.description||"").toLowerCase().indexOf("фреон")>=0)))total+=tk;

function addSwipe(el,onSwipeRight){
  var startX=0,startY=0,tracking=false;
  el.addEventListener("touchstart",function(e){
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true;
  },{passive:true});
  el.addEventListener("touchmove",function(e){
    if(!tracking)return;
    var dx=e.touches[0].clientX-startX;
    var dy=Math.abs(e.touches[0].clientY-startY);
    if(dy>30)tracking=false;
    if(dx>6)el.style.transform="translateX("+Math.min(dx*0.4,40)+"px)";
  },{passive:true});
  el.addEventListener("touchend",function(e){
    if(!tracking){el.style.transform="";return}
    var dx=e.changedTouches[0].clientX-startX;
    el.style.transform="";tracking=false;
    if(dx>60){el.classList.add("swipe-flash");setTimeout(function(){el.classList.remove("swipe-flash")},500);onSwipeRight()}
  },{passive:true});
  el.style.transition="transform .15s ease";
}

function toggleTask(cid,rid,tid,isDone){
  var uid=S.u.uid;
  var isAdm=myRole()==="admin"||myRole()==="manager";
  var cl=S.cl.find(function(c){return c.id===cid});if(!cl)return;
  var rp=(cl.repairs||[]).slice();var ri=rp.findIndex(function(r){return r.id===rid});if(ri<0)return;
  var ts=(rp[ri].tasks||[]).slice();var ti=ts.findIndex(function(x){return x.id===tid});if(ti<0)return;
  var task=ts[ti];
  if(task.assignees&&task.assignees.length>1){
    var doneBy=(task.doneBy||[]).slice();
    var myIdx=doneBy.indexOf(uid);
    var myDone=myIdx>=0;

    if(myDone&&isAdm){
      // Admin already done — force close for ALL
      doneBy=task.assignees.slice();
      ts[ti]=Object.assign({},task,{doneBy:doneBy,status:"done"});
    }else if(myDone&&!isAdm){
      // Regular user reverting own
      doneBy.splice(myIdx,1);
      ts[ti]=Object.assign({},task,{doneBy:doneBy,status:"in_progress"});
    }else{
      // Mark self as done
      doneBy.push(uid);
      var allDone=task.assignees.every(function(u){return doneBy.indexOf(u)>=0});
      ts[ti]=Object.assign({},task,{doneBy:doneBy,status:allDone?"done":"in_progress"});
    }
  }else{
    // Single assignee or legacy
    ts[ti]=Object.assign({},task,{status:isDone?"in_progress":"done"});
  }
  rp[ri]=Object.assign({},rp[ri],{tasks:ts});fbArr(cid,"repairs",rp);
}

var renderScheduled=false;
function R(){

// ═══ MY TASKS TAB ═══
function myTasksTab(ct){
  var isAdmin=myRole()==="admin";
  var isMgr=canManage();
  var hasAnything=false;

  // ── Сервисные задачи и проекты ──
  // Админ видит ВСЕ активные, механик — только свои
  var activeSvc=S.tasks.filter(function(t){
    if(tSt(t)==="done")return false;
    return isMgr?true:isMyTask(t);
  });

  if(activeSvc.length){
    hasAnything=true;
    // Разбить на мои и чужие для визуального разделения
    var mySvc=activeSvc.filter(function(t){return isMyTask(t)});
    var otherSvc=activeSvc.filter(function(t){return!isMyTask(t)});
    if(mySvc.length){
      secTitle(ct,"Мои задачи ("+mySvc.length+")");
      mySvc.forEach(function(t){ct.appendChild(buildTaskCard(Object.assign({},t,{type:t.taskType||"task",_showDelete:isAdmin})))});
    }
    if(otherSvc.length){
      secTitle(ct,"Задачи сотрудников ("+otherSvc.length+")");
      otherSvc.forEach(function(t){ct.appendChild(buildTaskCard(Object.assign({},t,{type:t.taskType||"task",_showDelete:isAdmin})))});
    }
  }

  // ── Ремонты в работе ──
  var repairGroups=[];
  S.cl.forEach(function(c){(c.repairs||[]).forEach(function(r){
    if(rSt(r)==="cancelled"||rSt(r)==="done")return;
    var allTasks=(r.tasks||[]).filter(function(t){return tSt(t)!=="done"});
    if(!allTasks.length)return;
    var visibleTasks=isMgr?allTasks:allTasks.filter(function(t){return isMyTask(t)});
    if(!visibleTasks.length)return;
    repairGroups.push({cid:c.id,cn:c.name,r:r,tasks:visibleTasks,v:(c.vehicles||[]).find(function(x){return x.id===r.vehicleId})});
  })});

  if(repairGroups.length){
    hasAnything=true;
    var totalTasks=repairGroups.reduce(function(s,i){return s+i.tasks.length},0);
    secTitle(ct,"Ремонты в работе ("+repairGroups.length+" машин, "+totalTasks+" задач)");
    repairGroups.forEach(function(item){renderVehicleTaskGroup(ct,item)});
  }

  if(!hasAnything){
    ct.appendChild(h("div",{s:{textAlign:"center",padding:"40px"}},
      h("div",{s:{fontSize:"14px",color:"#98A2B3",marginBottom:"12px"}},"—"),
      h("div",{s:{fontSize:"15px",fontWeight:"600",color:"#8A96A8"}},"Нет активных задач")));
  }
}

function makeRevenueChart(allR,rentPerMonth,subPerMonth){
  rentPerMonth=rentPerMonth||0;
  subPerMonth=subPerMonth||0;
  var now=new Date();
  var months=[];var labels=[];
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    var mN=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"][d.getMonth()];
    var repRev=allR.filter(function(r){return(r.closedAt||r.date||"").substring(0,7)===mk&&r.closedByManager}).reduce(function(s,r){return s+(parseFloat(r.cost)||0)},0);
    var cnt=allR.filter(function(r){return(r.closedAt||r.date||"").substring(0,7)===mk&&r.closedByManager}).length;
    // Для текущего месяца — добавляем аренду и абонплату, для прошлых — тоже (приблизительно, как постоянный доход)
    var curMK0=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    var isCurrentOrPast=mk<=curMK0;
    var extra=isCurrentOrPast?(rentPerMonth+subPerMonth):0;
    var rev=repRev+extra;
    months.push({mk:mk,rev:rev,repRev:repRev,rent:isCurrentOrPast?rentPerMonth:0,sub:isCurrentOrPast?subPerMonth:0,cnt:cnt,label:mN});
    labels.push(mN);
  }
  var maxRev=Math.max.apply(null,months.map(function(m){return m.rev}))||1;
  var W=320,H=120,PL=8,PR=8,PT=16,PB=28;
  var cW=W-PL-PR,cH=H-PT-PB;
  var barW=Math.floor(cW/months.length*0.55);
  var barGap=Math.floor(cW/months.length);
  var hasCost=months.some(function(m){return m.rev>0});

  var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:'+H+'px;display:block">';
  // Defs gradient
  svg+='<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="100%" stop-color="#0284c7" stop-opacity=".5"/></linearGradient></defs>';
  // Grid lines
  for(var gi=0;gi<=3;gi++){
    var gy=PT+cH*(gi/3);
    svg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="rgba(15,23,42,.05)" stroke-width="1"/>';
  }
  if(!hasCost){
    svg+='<text x="'+W/2+'" y="'+(H/2)+'" text-anchor="middle" fill="rgba(255,255,255,.2)" font-size="11" font-family="DM Sans,sans-serif">\u041d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445 \u043f\u043e \u0432\u044b\u0440\u0443\u0447\u043a\u0435</text>';
  }
  months.forEach(function(m,i){
    var x=PL+i*barGap+(barGap-barW)/2;
    var barH=m.rev>0?Math.max(4,Math.round(m.rev/maxRev*cH)):2;
    var y=PT+cH-barH;
    var isLast=(i===months.length-1);
    // Bar
    svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="4" fill="'+(isLast?"url(#bg1)":"rgba(56,189,248,.3)")+'" />';
    // Count badge above bar
    if(m.cnt>0)svg+='<text x="'+(x+barW/2)+'" y="'+(y-4)+'" text-anchor="middle" fill="rgba(56,189,248,.8)" font-size="9" font-family="DM Sans,sans-serif" font-weight="700">'+m.cnt+'</text>';
    // Month label
    svg+='<text x="'+(x+barW/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="rgba(148,163,184,.6)" font-size="9" font-family="DM Sans,sans-serif">'+m.label+'</text>';
    // Revenue label
    if(m.rev>0)svg+='<text x="'+(x+barW/2)+'" y="'+(y-14)+'" text-anchor="middle" fill="rgba(56,189,248,.6)" font-size="8" font-family="DM Sans,sans-serif">'+Math.round(m.rev)+'</text>';
  });
  svg+='</svg>';
  return {svg:svg,months:months};
}

function makeFreonPieChart(freonByType){
  var keys=Object.keys(freonByType);
  if(!keys.length)return null;
  var total=keys.reduce(function(s,k){return s+freonByType[k]},0);
  if(!total)return null;
  var colors=["#38bdf8","#34d399","#a78bfa","#fb923c","#f472b6","#22d3ee","#fbbf24","#667085"];
  var CX=80,CY=72,R=54,IR=26;
  var legendRowH=20;
  var legendStartY=CY*2+14;
  var totalH=legendStartY+keys.length*legendRowH+8;
  var W=200;
  var svg='<svg viewBox="0 0 '+W+' '+totalH+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">';
  // Donut segments
  var angle=-Math.PI/2;
  keys.forEach(function(k,i){
    var frac=freonByType[k]/total;
    var sweep=frac*Math.PI*2;
    var x1=CX+R*Math.cos(angle),y1=CY+R*Math.sin(angle);
    var x2=CX+R*Math.cos(angle+sweep),y2=CY+R*Math.sin(angle+sweep);
    var li=sweep>Math.PI?1:0;
    var xi=CX+IR*Math.cos(angle),yi=CY+IR*Math.sin(angle);
    var xi2=CX+IR*Math.cos(angle+sweep),yi2=CY+IR*Math.sin(angle+sweep);
    var c=colors[i%colors.length];
    svg+='<path d="M'+xi.toFixed(1)+','+yi.toFixed(1)+' L'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+R+','+R+' 0 '+li+',1 '+x2.toFixed(1)+','+y2.toFixed(1)+' L'+xi2.toFixed(1)+','+yi2.toFixed(1)+' A'+IR+','+IR+' 0 '+li+',0 '+xi.toFixed(1)+','+yi.toFixed(1)+' Z" fill="'+c+'" opacity=".85"/>';
    angle+=sweep;
  });
  // Center label
  svg+='<text x="'+CX+'" y="'+(CY+4)+'" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="12" font-weight="700" font-family="DM Sans,sans-serif">'+total.toFixed(1)+'кг</text>';
  // Legend BELOW the donut — two columns so it stays compact
  var col2start=W/2;
  keys.forEach(function(k,i){
    var c=colors[i%colors.length];
    var col=i%2===0?4:col2start;
    var row=Math.floor(i/2);
    var yy=legendStartY+row*legendRowH;
    var pct=Math.round(freonByType[k]/total*100);
    svg+='<rect x="'+col+'" y="'+(yy+1)+'" width="10" height="10" rx="3" fill="'+c+'"/>';
    svg+='<text x="'+(col+14)+'" y="'+(yy+10)+'" fill="rgba(203,213,225,.85)" font-size="10" font-family="DM Sans,sans-serif" font-weight="600">'+k+'</text>';
    svg+='<text x="'+(col+14)+'" y="'+(yy+20)+'" fill="rgba(148,163,184,.6)" font-size="9" font-family="DM Sans,sans-serif">'+freonByType[k].toFixed(1)+'кг · '+pct+'%</text>';
  });
  svg+='</svg>';
  return svg;
}

      var repData=[];var totalRepRev=0;

      })});

// ═══ MIGRATE BASE64 PHOTOS TO STORAGE ═══
function base64ToBlob(b64){
  var parts=b64.split(",");var mime=(parts[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
  var raw=atob(parts[1]);var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

function migrateAllPhotos(onStatus){
  var migrated=0,errors=0,total=0;

  // Collect all migration tasks
  var clientJobs=[];
  var taskJobs=[];

  // ── Scan clients ──
  S.cl.forEach(function(c){
    var needsUpdate=false;
    var repairs=(c.repairs||[]).slice();
    var vehicles=(c.vehicles||[]).slice();

    // Vehicle photos
    vehicles.forEach(function(v,vi){
      if(v.photo&&v.photo.indexOf("data:")===0&&v.photo.length>500){
        total++;
        var vidx=vi;
        clientJobs.push({cid:c.id,type:"vehicle",vidx:vidx,data:v.photo});
      }
    });

    // Repair photos & task photos
    repairs.forEach(function(r,ri){
      (r.photos||[]).forEach(function(p,pi){
        if(p.data&&p.data.indexOf("data:")===0&&p.data.length>500){
          total++;
          clientJobs.push({cid:c.id,type:"repairPhoto",ri:ri,pi:pi,data:p.data,pid:p.id});
        }
      });
      (r.tasks||[]).forEach(function(t,ti){
        (t.photos||[]).forEach(function(p,tpi){
          if(p.data&&p.data.indexOf("data:")===0&&p.data.length>500){
            total++;
            clientJobs.push({cid:c.id,type:"taskPhoto",ri:ri,ti:ti,tpi:tpi,data:p.data,pid:p.id});
          }
        });
      });
    });
  });

  // ── Scan service tasks ──
  S.tasks.forEach(function(t){
    (t.photos||[]).forEach(function(p,pi){
      if(p.data&&p.data.indexOf("data:")===0&&p.data.length>500){
        total++;
        taskJobs.push({tid:t.id,type:"svcPhoto",pi:pi,data:p.data,pid:p.id});
      }
    });
    (t.subtasks||[]).forEach(function(st,si){
      (st.photos||[]).forEach(function(p,spi){
        if(p.data&&p.data.indexOf("data:")===0&&p.data.length>500){
          total++;
          taskJobs.push({tid:t.id,type:"subPhoto",si:si,spi:spi,data:p.data,pid:p.id});
        }
      });
    });
  });

  onStatus("Найдено "+total+" фото для миграции...");

  // Process client jobs grouped by client
  var byCid={};
  clientJobs.forEach(function(j){if(!byCid[j.cid])byCid[j.cid]=[];byCid[j.cid].push(j)});

  var cidKeys=Object.keys(byCid);
  var cidIdx=0;

  function processNextClient(){
    if(cidIdx>=cidKeys.length)return processServiceTasks();
    var cid=cidKeys[cidIdx];
    var jobs=byCid[cid];
    var cl=S.cl.find(function(c){return c.id===cid});
    if(!cl){cidIdx++;return processNextClient()}

    onStatus("Клиент: "+(cl.name||cid)+" ("+jobs.length+" фото)... ["+migrated+"/"+total+"]");

    var repairs=(cl.repairs||[]).map(function(r){return Object.assign({},r,{photos:(r.photos||[]).slice(),tasks:(r.tasks||[]).map(function(t){return Object.assign({},t,{photos:(t.photos||[]).slice()})})})});
    var vehicles=(cl.vehicles||[]).map(function(v){return Object.assign({},v)});

    var chain=Promise.resolve();
    jobs.forEach(function(j){
      chain=chain.then(function(){
        var blob=base64ToBlob(j.data);
        var photoId=j.pid||gid();
        var path="photos/"+S.u.uid+"/"+photoId+".jpg";
        var sRef=ref(storage,path);
        return uploadBytes(sRef,blob).then(function(snap){
          return getDownloadURL(snap.ref);
        }).then(function(url){
          if(j.type==="vehicle"){
            vehicles[j.vidx].photo=url;
          }else if(j.type==="repairPhoto"){
            var ph=repairs[j.ri].photos;
            var idx=ph.findIndex(function(p){return p.id===j.pid});
            if(idx>=0)ph[idx]={id:j.pid,url:url,path:path};
          }else if(j.type==="taskPhoto"){
            var ph2=repairs[j.ri].tasks[j.ti].photos;
            var idx2=ph2.findIndex(function(p){return p.id===j.pid});
            if(idx2>=0)ph2[idx2]={id:j.pid,url:url,path:path};
          }
          migrated++;
          onStatus("Загружено "+migrated+"/"+total+"...");
        }).catch(function(err){
          console.error("Migration error:",err);errors++;
        });
      });
    });

    return chain.then(function(){
      // Save updated client doc
      var upd={vehicles:vehicles,repairs:repairs};
      return fbUpd(cid,upd);
    }).then(function(){
      cidIdx++;
      return processNextClient();
    });
  }

  // Process service tasks
  var byTid={};
  taskJobs.forEach(function(j){if(!byTid[j.tid])byTid[j.tid]=[];byTid[j.tid].push(j)});

  function processServiceTasks(){
    var tidKeys=Object.keys(byTid);
    var chain=Promise.resolve();
    tidKeys.forEach(function(tid){
      chain=chain.then(function(){
        var jobs2=byTid[tid];
        var t=S.tasks.find(function(x){return x.id===tid});
        if(!t)return;
        var photos=(t.photos||[]).slice();
        var subtasks=(t.subtasks||[]).map(function(st){return Object.assign({},st,{photos:(st.photos||[]).slice()})});

        onStatus("Задача: "+(t.title||tid)+" ("+jobs2.length+" фото)... ["+migrated+"/"+total+"]");

        var inner=Promise.resolve();
        jobs2.forEach(function(j){
          inner=inner.then(function(){
            var blob=base64ToBlob(j.data);
            var photoId=j.pid||gid();
            var path="photos/"+S.u.uid+"/"+photoId+".jpg";
            var sRef=ref(storage,path);
            return uploadBytes(sRef,blob).then(function(snap){
              return getDownloadURL(snap.ref);
            }).then(function(url){
              if(j.type==="svcPhoto"){
                var idx=photos.findIndex(function(p){return p.id===j.pid});
                if(idx>=0)photos[idx]={id:j.pid,url:url,path:path};
              }else if(j.type==="subPhoto"){
                var ph=subtasks[j.si].photos;
                var idx2=ph.findIndex(function(p){return p.id===j.pid});
                if(idx2>=0)ph[idx2]={id:j.pid,url:url,path:path};
              }
              migrated++;
              onStatus("Загружено "+migrated+"/"+total+"...");
            }).catch(function(err){console.error("Migration error:",err);errors++});
          });
        });

        return inner.then(function(){
          return fbUpdTask(tid,{photos:photos,subtasks:subtasks});
        });
      });
    });

    return chain.then(function(){
      return{migrated:migrated,errors:errors};
    });
  }

  return processNextClient();
}

function exportBackupJSON(){
  var stamp=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);

    settings:{finance:S.finance}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

// Импорт из JSON-бэкапа.
// ВАЖНО: режим "merge" — добавляет/обновляет по id, не удаляет существующее.
// Полная замена доступна отдельной кнопкой с двойным подтверждением.
function importBackupJSON(file,mode,onStatus){
  return new Promise(function(resolve,reject){
    var fr=new FileReader();
    fr.onload=function(e){
      var data;
      try{data=JSON.parse(e.target.result)}
      catch(err){reject(new Error("Файл повреждён или это не JSON"));return}
      if(!data||!data.version){reject(new Error("Это не бэкап РефСервисДВ"));return}
      doImportBackup(data,mode,onStatus).then(resolve).catch(reject);
    };
    fr.onerror=function(){reject(new Error("Не удалось прочитать файл"))};
    fr.readAsText(file);
  });
}

function doImportBackup(data,mode,onStatus){
  // mode: "merge" — добавить/обновить по id; "replace" — стереть всё и записать заново
  var stats={clients:0,tasks:0,freezers:0,errors:0};

  function chunk(arr,size){var out=[];for(var i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out}

  function writeCollection(name,items,counterKey){
    if(!items||!items.length)return Promise.resolve();
    onStatus("Записываю "+name+" ("+items.length+")...");
    var groups=chunk(items,400);
    var p=Promise.resolve();
    groups.forEach(function(g){
      p=p.then(function(){
        var b=writeBatch(db);
        g.forEach(function(item){
          var id=item.id;if(!id)return;
          var clean=Object.assign({},item);delete clean.id;
          // Удаляем поля createdAt с Timestamp-объектами (после JSON они не Timestamp), Firebase это нормально проглотит как обычные поля
          b.set(doc(db,name,id),clean,{merge:mode==="merge"});
          stats[counterKey]++;
        });
        return b.commit();
      }).catch(function(err){stats.errors++;console.warn(name+" batch err",err)});
    });
    return p;
  }

  // Режим "replace" отключён намеренно — для защиты от случайной потери данных.
  // Импорт работает только в режиме merge (добавление/обновление по id).
  if(mode==="replace"){
    return Promise.reject(new Error("Режим полной замены отключён. Используйте только режим merge."));
  }
  var chain=Promise.resolve();
  chain=chain
    .then(function(){return writeCollection("clients",data.clients||[],"clients")})
    .then(function(){return writeCollection("servicetasks",data.servicetasks||[],"tasks")})
    .then(function(){return writeCollection("freezers",data.freezers||[],"freezers")})
    .then(function(){
      if(data.settings&&data.settings.finance){
        onStatus("Записываю настройки финансов...");
        return setDoc(doc(db,"settings","finance"),data.settings.finance,{merge:mode==="merge"});
      }
    })
    .then(function(){return stats});
  return chain;
}

// ═══ NOTIFICATION SOUND + BROWSER NOTIFICATIONS + PWA ═══
var lastTaskCount=-1;
var notifPermAsked=false;

function ensureNotifPermission(){
  if(!("Notification" in window))return;
  // Если разрешение уже выдано — пробуем инициализировать FCM
  if(Notification.permission==="granted"){
    initFCM();
    return;
  }
  if(notifPermAsked)return;
  if(Notification.permission==="default"){
    notifPermAsked=true;
    // Спрашиваем разрешение мягко — после того как пользователь зашёл и видит интерфейс
    setTimeout(function(){
      try{
        Notification.requestPermission().then(function(perm){
          if(perm==="granted")initFCM();
        }).catch(function(){});
      }catch(e){}
    },3000);
  }
}

function showBrowserNotif(title,body){
  if(!("Notification" in window))return;
  if(Notification.permission!=="granted")return;
  // Показываем браузерное уведомление только если вкладка не активна.
  // Когда вкладка активна — звук уже есть, дублировать не нужно.
  if(document.visibilityState==="visible")return;
  try{
    var n=new Notification(title,{
      body:body,
      icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230284c7'/><text x='50%' y='52%' dominant-baseline='middle' text-anchor='middle' font-size='62'>❄️</text></svg>",
      tag:"refservicedv-task",
      requireInteraction:false
    });
    n.onclick=function(){window.focus();n.close()};
    setTimeout(function(){try{n.close()}catch(e){}},8000);
  }catch(e){console.warn("notif failed",e)}
}

    // Соберём заголовки новых задач только когда они реально появились — это редкая ветка
    var newTasksTitles=[];
    S.cl.forEach(function(c){(c.repairs||[]).forEach(function(r){(r.tasks||[]).forEach(function(t){if(isMyTask(t)&&tSt(t)!=="done")newTasksTitles.push((t.description||"задача").substring(0,60))})})});
    S.tasks.forEach(function(t){if(isMyTask(t)&&tSt(t)!=="done")newTasksTitles.push((t.title||t.description||"задача").substring(0,60))});
    var title=diff===1?"Новая задача":"Новых задач: "+diff;
    var body=newTasksTitles.slice(-diff).join(", ")||"Откройте CRM, чтобы посмотреть";
    showBrowserNotif(title,body);
  }
  lastTaskCount=count;
}

// ── Кнопка "Установить приложение" появляется автоматически в Chrome/Edge ──
var deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  deferredInstallPrompt=e;
  // Показываем подсказку через 5 секунд после загрузки, если ещё не установлено
  setTimeout(function(){
    if(!deferredInstallPrompt)return;
    if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)return;
    showInstallHint();
  },5000);
});

function showInstallHint(){
  if(!deferredInstallPrompt)return;
  if(document.getElementById("pwaInstallHint"))return;
  var hint=document.createElement("div");
  hint.id="pwaInstallHint";
  hint.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(14,165,233,.5);z-index:1000;display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease;cursor:pointer;max-width:90%;";
  hint.innerHTML="Установить приложение <span style=\"opacity:.8;font-size:18px;margin-left:4px\">×</span>";
  hint.onclick=function(ev){
    if(ev.target.tagName==="SPAN"){hint.remove();deferredInstallPrompt=null;return}
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(function(){deferredInstallPrompt=null;hint.remove()});
    }
  };
  document.body.appendChild(hint);
  setTimeout(function(){if(hint.parentNode)hint.remove()},15000);
}
function playNotifSound(){
  try{
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator();var g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.setValueAtTime(880,ac.currentTime);
    o.frequency.setValueAtTime(1100,ac.currentTime+0.1);
    o.frequency.setValueAtTime(880,ac.currentTime+0.2);
    g.gain.setValueAtTime(0.3,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+0.4);
    o.start(ac.currentTime);o.stop(ac.currentTime+0.4);
  }catch(e){}
}
